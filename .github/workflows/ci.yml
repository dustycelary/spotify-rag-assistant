name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pipeline/requirements.txt
        pip install ruff pytest pytest-mock

    - name: Run Ruff Lint & Format Checks
      run: |
        ruff check .
        ruff format . --check

    - name: Run Test Suite
      run: |
        PYTHONPATH=. pytest
